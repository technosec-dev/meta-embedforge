# U-Boot options a signed FIT needs, applied only when a build signs.
#
# CONFIG_FIT is a menuconfig bool with no default, so it is compiled out
# unless a defconfig asks for it, and most board defconfigs do not.
# rpi_arm64_defconfig is one of them: without this, U-Boot loads the signed
# fitImage EmbedForge produced and refuses it with
#
#	Wrong Image Format for bootm command
#	ERROR: can't get kernel image!
CONFIG_FIT=y

# Verification, not merely parsing. Selects IMAGE_SIGN_INFO and FIT_FULL_CHECK
# and implies RSA_VERIFY, and turns off LEGACY_IMAGE_FORMAT by default, which
# is the point: a board that will boot an unsigned uImage has not gained much
# from signing the FIT.
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y

# Room to decompress. The FIT carries a compressed kernel, so the image on
# disk is a fraction of what bootm unpacks: a ~9MB FIT holds an arm64 kernel
# several times that size. The default limit is far below it on most boards,
# and exceeding it fails after the signature has already been checked, which
# reads as a signing problem when it is not.
CONFIG_SYS_BOOTM_LEN=0x4000000
